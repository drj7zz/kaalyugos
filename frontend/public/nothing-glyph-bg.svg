<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="60%" stop-color="#0b0c0e"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.08" />
    </pattern>
    <pattern id="fineGrid" width="112" height="112" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.12" />
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- Dot Matrix Array -->
  <rect width="1920" height="1080" fill="url(#dotGrid)"/>
  <rect width="1920" height="1080" fill="url(#fineGrid)"/>

  <!-- Minimal Glyph Geometries -->
  <g fill="none" stroke="#ffffff" opacity="0.18" stroke-width="2">
    <!-- Camera/Glyph Pill -->
    <rect x="760" y="240" width="400" height="600" rx="200" stroke-width="2.5" stroke-dasharray="6 6"/>
    <circle cx="960" cy="420" r="130" stroke-width="2.5"/>
    <circle cx="960" cy="420" r="70" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M960,180 L960,240 M960,840 L960,900" stroke-width="2"/>

    <!-- Diagonal Accent Lines -->
    <path d="M1260,340 L1360,240 M1260,370 L1390,240" stroke-width="1.5" opacity="0.15"/>
    <!-- Slash Stripe Bar -->
    <path d="M620,700 L520,800 M650,700 L550,800" stroke-width="1.5" opacity="0.15"/>
  </g>

  <!-- Iconic Red Accent Glyph Dot -->
  <circle cx="1180" cy="300" r="4.5" fill="#d71920" filter="url(#softGlow)"/>
  <circle cx="1180" cy="300" r="1.5" fill="#ffffff"/>

  <!-- Minimalist Corner Accents -->
  <g fill="none" stroke="#ffffff" opacity="0.25" stroke-width="1.5">
    <path d="M40,60 L40,40 L60,40" />
    <path d="M1880,60 L1880,40 L1860,40" />
    <path d="M40,1020 L40,1040 L60,1040" />
    <path d="M1880,1020 L1880,1040 L1860,1040" />
  </g>
</svg>

