<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="whiteGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f2f4f8"/>
      <stop offset="100%" stop-color="#e8ecf2"/>
    </radialGradient>
    <pattern id="lightDotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#141824" opacity="0.12" />
    </pattern>
    <pattern id="lightFineGrid" width="112" height="112" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#141824" opacity="0.18" />
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#whiteGlow)"/>
  <rect width="1920" height="1080" fill="url(#lightDotGrid)"/>
  <rect width="1920" height="1080" fill="url(#lightFineGrid)"/>

  <!-- Light Minimal Geometry -->
  <g fill="none" stroke="#141824" opacity="0.15" stroke-width="2">
    <rect x="760" y="240" width="400" height="600" rx="200" stroke-dasharray="6 6"/>
    <circle cx="960" cy="420" r="130" stroke-width="2"/>
    <circle cx="960" cy="420" r="70" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Red Accent Dot -->
  <circle cx="1180" cy="300" r="4.5" fill="#d71920"/>
  <circle cx="1180" cy="300" r="1.5" fill="#ffffff"/>
</svg>
